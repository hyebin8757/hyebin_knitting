[build]
command = "yarn install && yarn generate"
publish = ".output/public"
functions = "netlify/functions"

[context.production.environment]
NODE_VERSION = "18"

[[redirects]]
from = "/.netlify/functions/*"
to = "/.netlify/functions/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200